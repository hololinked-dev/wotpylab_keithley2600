[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wotpylab-keithley2600"
version = "0.1.0"
description = "Keithley 2600 series SMUs served as a Web of Things device with hololinked."
authors = [
    {name = "Vignesh Vaidyanathan", "email" = "info@hololinked.dev"},
]
# hololinked requires Python >= 3.11
requires-python = ">=3.11"
dependencies = [
    "keithley2600>=2.1.0",
    "hololinked[all]>=0.4.2",
    "standard-xdrlib>=3.13.0; python_version >= '3.13'", # keithley2600 imports the stdlib xdrlib, removed in Python 3.13
]

[project.scripts]
wotpylab-keithley2600 = "wotpylab_keithley2600.run:main"

[tool.setuptools.packages.find]
include = ["wotpylab_keithley2600*"]

[tool.uv.sources]
hololinked = { path = "hololinked", editable = true }

[tool.uv]
config-settings-package = { hololinked = { editable_mode = "compat" } }
