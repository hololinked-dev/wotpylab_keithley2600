name: CD

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a running upload

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - name: check the release tag against the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the project version v$version in pyproject.toml"
            exit 1
          fi

      - name: build sdist and wheel
        run: uv build

      - name: check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wotpylab-keithley2600
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a manual run may have uploaded this version already, TestPyPI does not accept a version twice
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi # add required reviewers to this environment
      url: https://pypi.org/p/wotpylab-keithley2600
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
