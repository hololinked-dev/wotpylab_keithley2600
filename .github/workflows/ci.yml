name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: install
        # only the tools, ruff does not import the package
        run: uv sync --locked --only-group dev

      - name: ruff check
        run: uv run --no-sync ruff check wotpylab_keithley2600

      - name: ruff format
        run: uv run --no-sync ruff format --check wotpylab_keithley2600

  ty:
    name: type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: install
        # with the package dependencies, ty resolves hololinked and keithley2600 types
        run: uv sync --locked --group dev

      - name: ty
        run: uv run --no-sync ty check wotpylab_keithley2600

  bandit:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: install
        run: uv sync --locked --only-group scanning

      - name: bandit, new findings only
        run: uv run --no-sync bandit -c pyproject.toml -b .bandit-baseline.json -r wotpylab_keithley2600

      - name: bandit report, including the baseline
        if: always()
        run: uv run --no-sync bandit -c pyproject.toml -r wotpylab_keithley2600 -f json -o bandit-report.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  gitleaks:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history

      # the CLI image instead of gitleaks/gitleaks-action, which needs a paid license for organization repositories
      - name: gitleaks, history and working tree
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 dir /repo/wotpylab_keithley2600 --redact --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: build sdist and wheel
        run: uv build

      - name: check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
